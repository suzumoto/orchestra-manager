[COMMAND_CHANNEL]
command_channel_1 = 出欠管理システム

[RSVP_CHANNEL]
; RSVP_channel_1 = 全奏用、RSVP_channel_2 = 分奏用のカレンダーチャンネル名。
; 投稿本文の日付行に『全奏』『分奏』があれば、それを優先してシートを振り分ける。
; 1 つのチャンネルに全奏/分奏が混在する運用では、同じチャンネル名を両方に書く
; （その場合、キーワードの無い投稿は出欠管理の対象外になる）。
RSVP_channel_1 = 📅全奏カレンダー
RSVP_channel_2 = 📅分奏カレンダー

[OUTPUT_CHANNEL]
output_channel = 🎎出欠表出力

[ROLE]
output_role_1 = 運営
output_role_2 = サーバー管理

[PROGRAM]
program_1 = 前
program_2 = 中
program_3 = メイン

[EMOJI]
shusseki = shusseki
kesseki  = kesseki
chikoku  = chikoku
soutai   = soutai
output   = shutsuryoku
dm       = 🇩

[SPREADSHEET]
zensou_worksheet_name = 全奏
bunsou_worksheet_name = 分奏
credential_json = credentials.json

[SLIDES]
slide_index = 1
credential_json = credentials.json

[MEMBER]
; シートへ登録するメンバーを絞るロール名（空欄なら全サーバーメンバー）
sync_role = 第12回演奏会参加者
; シートの行並べ替えに使うパート順（カンマ区切り。'/' 区切りは同順位の別名）
part_order = Fl/Picc/Pic, Ob/EHr, Cl/B.Cl, Fg/C.Fg, Hr, Tp/Cor, Tb/Tuba, Timp, Perc, Vn/Vn1st/Vn2nd, Va, Vc, Cb

[PART_ROLE]
Fl   = ^Fl\.?$
Cl   = ^Cl\.?$
Ob   = ^Ob\.?$
Fg   = ^Fg\.?$
Hr   = ^Hr\.?$
Tp   = ^Tp\.?$
Tb   = ^Tb\.?$
Tuba = ^Tuba\.?$
; Vn は 1st / 2nd 不問
Vn   = ^Vn\.?$
Va   = ^Va\.?$
Vc   = ^Vc\.?$
Cb   = ^Cb\.?$
Perc = ^Perc\.?$
Pf   = ^Pf\.?$
Hp   = ^Hp\.?$
Timp = ^Timp\.?$

[REMINDER]
; リマインドする日数オフセット（練習日の何日前か、カンマ区切り）
remind_days_before = 3,1
; リマインド時刻 (JST, HH:MM)
remind_time = 19:00
; 当日出欠表の自動出力時刻 (JST, HH:MM)
output_time = 07:00
; リマインドでメンションするロール名
mention_role = 運営
; RSVPチャンネルの履歴走査件数
scan_limit = 30