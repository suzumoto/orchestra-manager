[COMMAND_CHANNEL]
command_channel_1 = 出欠管理システム

[RSVP_CHANNEL]
; RSVP_channel_1 = シート 1（worksheet_1）、RSVP_channel_2 = シート 2（worksheet_2）の
; カレンダーチャンネル名。
RSVP_channel_1 = 📅カレンダー_オケ
RSVP_channel_2 = 📅カレンダー_合唱

[OUTPUT_CHANNEL]
output_channel = 🎎出欠表出力

[ROLE]
output_role_1 = 管理者
output_role_2 = 運営

[PROGRAM]
; 空欄なら曲ごとに分けず、全曲共通の 1 枚で出欠表を作る

[EMOJI]
shusseki = shusseki
kesseki  = kesseki
chikoku  = chikoku
soutai   = soutai
output   = shutsuryoku
dm       = 🇩

[SPREADSHEET]
worksheet_1 = オーケストラ
worksheet_2 = 合唱
; no: 2 枚は独立したシート（メンバー・パートをシートごとに持ち、投稿はチャンネルだけで振り分ける）
mirror_sheet_2 = no
credential_json = credentials.json

[SLIDES]
; 座席スライドの番号（0 始まり）
slide_index_1 = 1
slide_index_2 = 2
credential_json = credentials.json

[MEMBER]
; シートへ登録するメンバーを絞るロール名（空欄なら全サーバーメンバー）
sync_role =
; パートのロールが無くてもシート 2 の参加者とみなすロール（カンマ区切り）。
; どちらのシートの参加者とも判定できない人は両方のシートに登録される
member_roles_2 = Chor
; シートの行並べ替えに使うパート順（カンマ区切り。'/' 区切りは同順位の別名）。
; スライドの座席名（Fl-1 の Fl、Vn1st-1 の Vn1st）と同じ名前で書く。
; ';' で区切ったまとまりの境目には、シートに横の太線を自動で引く
part_order = Cond, 合唱指揮, 編曲; Pic/Picc, Fl; Ob, E.Hr; Cl, B.Cl; Fg, C.Fg; Hr; Tp/Cor; Tb, Tuba; Pf; Timp, Perc; バンダ; Vn1st; Vn2nd; Va; Vc; Cb
part_order_2 = Cond, 合唱指揮, 編曲, Pf; Sop; Alt; Ten; Bass; 女声; 男声; 未定
; シートを手で直したとき（行の削除・パートの書き換えなど）に区切り線を追従させる確認間隔（分）
separator_check_minutes = 10

[PART_ROLE]
; シート 1 のパート = ロール名の正規表現（パート名はスライドの座席名に合わせる）
Fl    = ^Picc&Fl$
Ob    = ^Ob&E\.Hr$
Cl    = ^Cl\.?$
Fg    = ^Fg\.?$
Hr    = ^Hr\.?$
Tp    = ^Tp\.?$
; Tuba も Tb として登録されるので、シートで手直しする
Tb    = ^Tb&Tub$
Perc  = ^Perc\.?$
バンダ = ^バンダ$
Vn1st = ^1stVn$
Vn2nd = ^2ndVn$
Va    = ^Va\.?$
Vc    = ^Vc\.?$
Cb    = ^Cb\.?$

[PART_ROLE_2]
; シート 2 のパート = ロール名の正規表現（声部ロールは使わない運用なので空）

[PART_NAME_2]
; ロールでパートが決まらないとき、表示名（サーバーニックネーム）から推定する。
; 名前の中に英単語・カタカナとして含まれていれば一致（'Sop.名前' 'Alto 名前' '(Tenor)名前' 'ソプラノ 名前' など）。
; 前後が英字・カタカナにくっついている場合は一致しない（'コントラバス' の 'バス' など）。
; 一致しない人はシートで手入力する
Sop  = (?<![A-Za-z])Sop(rano)?(?![A-Za-z]) | (?<![ァ-ヶー])ソプラノ(?![ァ-ヶー])
Alt  = (?<![A-Za-z])Alt(o)?(?![A-Za-z]) | (?<![ァ-ヶー])アルト(?![ァ-ヶー])
Ten  = (?<![A-Za-z])Ten(or)?(?![A-Za-z]) | (?<![ァ-ヶー])テノール(?![ァ-ヶー])
Bass = (?<![A-Za-z])Bass?(?![A-Za-z]) | (?<![ァ-ヶー])バス(?![ァ-ヶー])

[REMINDER]
; リマインドする日数オフセット（練習日の何日前か、カンマ区切り）
remind_days_before = 3,1
; リマインド時刻 (JST, HH:MM)
remind_time = 19:00
; 当日出欠表の自動出力時刻 (JST, HH:MM)
output_time = 07:00
; リマインドでメンションするロール名
mention_role = 運営
; RSVPチャンネルの履歴走査件数
scan_limit = 30
; 予定時刻のリマインド・当日出欠表の自動出力が通信障害などで失敗したとき、
; 予定時刻から何時間のあいだ再試行するか / 再試行の間隔（分）
retry_hours = 5
retry_interval_minutes = 5
